<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRAGDROP — Кейсы и Апгрейд Standoff 2</title>
    <style>
        :root {
            --bg-main: #0b0d13;
            --bg-card: #141824;
            --bg-hover: #1c2233;
            --accent: #ff9900;
            --accent-hover: #ffb340;
            --text-main: #ffffff;
            --text-muted: #8b95b0;
            --border: #232a3d;
            --rare-common: #8a94a6;
            --rare-uncommon: #4b69ff;
            --rare-rare: #8847ff;
            --rare-epic: #d32ce6;
            --rare-legendary: #eb4b4b;
            --rare-arcane: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .logo span {
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--bg-hover);
            color: var(--text-main);
            border-color: var(--border);
        }

        .nav-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-box {
            background: #0f121a;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gold-icon {
            color: var(--accent);
            font-weight: 900;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
        }

        /* Live Drop Tape */
        .live-tape {
            background: #0e1118;
            border-bottom: 1px solid var(--border);
            padding: 8px 15px;
            display: flex;
            gap: 10px;
            overflow: hidden;
            white-space: nowrap;
        }

        .live-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-bottom: 3px solid var(--rare-arcane);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 170px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Main Container */
        main {
            max-width: 1240px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Cases Grid */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .case-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
            position: relative;
            overflow: hidden;
        }

        .case-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px rgba(255, 153, 0, 0.12);
        }

        .case-icon {
            font-size: 64px;
            margin: 15px 0;
            filter: drop-shadow(0 0 15px rgba(255, 153, 0, 0.3));
        }

        .case-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .case-price {
            display: inline-block;
            background: rgba(255, 153, 0, 0.15);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
        }

        /* Roulette Area */
        .roulette-view {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            margin
